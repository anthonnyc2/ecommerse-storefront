  path-to-regexp: ">=6.3.0"
  "ts-api-utils>typescript": "5.9.3"
  fast-uri: ">=3.1.6"
  sharp: ">=0.35.5"
  brace-expansion@1: "^1.1.20"
  brace-expansion@5: "^5.0.11"
  undici: ">=8.12.2"
  zod: ">=4.6.6"
